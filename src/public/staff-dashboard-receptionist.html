<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receptionist Dashboard - PetCareX</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/unified-dashboard.css">
    <link rel="stylesheet" href="css/theme-receptionist.css">
</head>
<body>
    <header class="header">
        <div class="header-container">
            <div class="logo"><i class="fas fa-paw"></i> <span>PetCareX Staff</span></div>
            <div class="header-right">
                <div class="user-info">
                    <span id="userName" class="name">Tiếp Tân</span>
                    <span class="loyalty-points">Receptionist</span>
                </div>
                <button id="logoutBtn" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Đăng xuất</button>
            </div>
        </div>
    </header>

    <main class="dashboard-container">
        <div class="welcome-banner">
            <div class="banner-content">
                <h1 id="greeting-message">Chào buổi sáng, Tiếp tân!</h1>
                <p>Quản lý lịch hẹn và khách hàng tại chi nhánh</p>
                <div style="display: flex; gap: 20px; margin-top: 15px;">
                    <div><small>Hôm nay:</small> <strong id="todayBookings">0</strong></div>
                    <div><small>Chờ xác nhận:</small> <strong id="pendingBookings">0</strong></div>
                </div>
            </div>
            <div class="banner-icon"><i class="fas fa-user-tie"></i></div>
        </div>

        <div class="tabs-navigation">
            <div class="tabs-header">
                <button class="tab-btn active" data-tab="bookings"><i class="fas fa-calendar-alt"></i> Quản Lý Lịch Hẹn</button>
                <button class="tab-btn" data-tab="payment-confirmation"><i class="fas fa-check-circle"></i> Xác Nhận Thanh Toán</button>
            </div>
        </div>

        <div class="tabs-content">
            <div class="tab-pane active" id="bookings-tab">
                <div class="tab-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
                    <h2>Lịch Hẹn Chi Nhánh</h2>
                    <div style="width: 250px;">
                        <select id="maChiNhanh" class="form-group" style="padding: 10px; width: 100%; border-radius: 8px; border: 1px solid #ddd;"></select>
                    </div>
                </div>
                <div id="bookingList" class="pets-grid">
                    </div>
            </div>

            <div class="tab-pane" id="payment-confirmation-tab">
                <div class="tab-header" style="margin-bottom:1.5rem;">
                    <h2>Xác Nhận Thanh Toán</h2>
                    <p style="color:#666; font-size:0.95rem;">Danh sách tất cả hóa đơn khách hàng đã thanh toán nhưng chưa xác nhận</p>
                </div>
                <div id="paymentConfirmationList" style="display:grid; gap:15px;">
                    <!-- Danh sách sẽ được load từ API -->
                </div>
            </div>
        </div>
    </main>

    <div id="doctorSelectionModal" class="modal">
        <div class="modal-content">
            <h2 style="margin-bottom:1.5rem;">Tiếp Nhận Lịch Hẹn</h2>
            <div id="modalBookingInfo" style="font-size:0.9rem; margin-bottom:1.5rem; color:#666; background:#f9fafb; padding:10px; border-radius:8px;"></div>
            
            <div class="form-group" style="margin-bottom:1.5rem;">
                <label style="display:block; margin-bottom:5px; font-weight:600;">Bác Sĩ Phụ Trách:</label>
                <select id="selectDoctor" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;"></select>
            </div>

            <div id="vaccinePackageSection" class="form-group" style="margin-bottom:1.5rem; display:none;">
                <label style="display:block; margin-bottom:5px; font-weight:600;">Gói Tiêm Thú Cưng Đã Mua:</label>
                <select id="maGoiTiem" style="width:100%; padding:10px; border-radius:8px; border:1px solid #ddd;"></select>
            </div>

            <div style="display:flex; gap:10px; justify-content:flex-end;">
                <button onclick="closeDoctorModal()" style="padding:10px 20px; border:none; border-radius:8px; cursor:pointer; background:#eee;">Hủy</button>
                <button id="finalConfirmBtn" class="btn-primary">Xác Nhận Tiếp Nhận</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/staff-dashboard-receptionist.js"></script>
</body>
</html>
