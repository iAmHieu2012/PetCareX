<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receptionist Dashboard - PetCareX</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/unified-dashboard.css">
    <link rel="stylesheet" href="css/theme-receptionist.css">
</head>
<body>
    <header class="header">
        <div class="header-container">
            <div class="logo"><i class="fas fa-paw"></i> <span>PetCareX Staff</span></div>
            <div class="header-right">
                <div class="user-info">
                    <span id="userName" class="name">Tiếp Tân</span>
                    <span class="loyalty-points">Receptionist</span>
                </div>
                <button id="logoutBtn" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Đăng xuất</button>
            </div>
        </div>
    </header>

    <main class="dashboard-container">
        <div class="welcome-banner">
            <div class="banner-content">
                <h1 id="greeting-message">Chào buổi sáng, Tiếp tân!</h1>
                <p>Quản lý lịch hẹn và khách hàng tại chi nhánh</p>
                <div class="flex gap-lg mt-lg">
                    <div><small>Hôm nay:</small> <strong id="todayBookings">0</strong></div>
                    <div><small>Chờ xác nhận:</small> <strong id="pendingBookings">0</strong></div>
                </div>
            </div>
            <div class="banner-icon"><i class="fas fa-user-tie"></i></div>
        </div>

        <div class="tabs-navigation">
            <div class="tabs-header">
                <button class="tab-btn active" data-tab="bookings"><i class="fas fa-calendar-alt"></i> Quản Lý Lịch Hẹn</button>
                <button class="tab-btn" data-tab="payment-confirmation"><i class="fas fa-check-circle"></i> Xác Nhận Thanh Toán</button>
            </div>
        </div>

        <div class="tabs-content">
            <div class="tab-pane active" id="bookings-tab">
                <div class="tab-header flex-between mb-lg">
                    <h2>Lịch Hẹn Chi Nhánh</h2>
                    <div class="w-1/3 min-w-sm">
                        <select id="maChiNhanh" class="form-group"></select>
                    </div>
                </div>
                <div id="bookingList" class="pets-grid">
                    </div>
            </div>

            <div class="tab-pane" id="payment-confirmation-tab">
                <div class="tab-header mb-lg">
                    <h2>Xác Nhận Thanh Toán</h2>
                    <p class="text-muted text-sm">Danh sách tất cả hóa đơn khách hàng đã thanh toán nhưng chưa xác nhận</p>
                </div>
                <div id="paymentConfirmationList" class="grid-2 gap-md">
                    <!-- Danh sách sẽ được load từ API -->
                </div>
            </div>
        </div>
    </main>

    <div id="doctorSelectionModal" class="modal">
        <div class="modal-content">
            <h2 class="mb-lg">Tiếp Nhận Lịch Hẹn</h2>
            <div id="modalBookingInfo" class="text-sm text-muted p-sm mb-lg bg-light rounded-md"></div>
            
            <div class="form-group mb-lg">
                <label class="block font-semibold mb-sm">Bác Sĩ Phụ Trách:</label>
                <select id="selectDoctor" class="w-full"></select>
            </div>

            <div id="vaccinePackageSection" class="form-group mb-lg" style="display:none;">
                <label class="block font-semibold mb-sm">Gói Tiêm Thú Cưng Đã Mua:</label>
                <select id="maGoiTiem" class="w-full"></select>
            </div>

            <div class="flex-end gap-md">
                <button onclick="closeDoctorModal()" class="btn-secondary">Hủy</button>
                <button id="finalConfirmBtn" class="btn-primary">Xác Nhận Tiếp Nhận</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/receptionist-dashboard.js"></script>
</body>
</html>
