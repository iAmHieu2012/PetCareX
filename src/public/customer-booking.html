<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đặt Lịch Hẹn - PETCAREX</title>
    <link rel="stylesheet" href="/css/booking.css">
    <style>
        .page-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logout-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .logout-btn:hover {
            background: #c82333;
        }
        .tabs {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <div>
                <h1>📅 ĐẶT LỊCH HẸN DỊCH VỤ</h1>
                <p style="margin-top: 5px; font-size: 14px;">Khách hàng</p>
            </div>
            <button class="logout-btn" onclick="logout()">Đăng Xuất</button>
        </div>

        <!-- KHÁCH HÀNG ĐẶT LỊCH HẸN -->
        <div class="form-container">
            <form id="bookingForm">
                <h2>✏️ ĐẶT LỊCH HẸN</h2>
                
                <div class="form-group">
                    <label for="MaKhachHang">
                        <span class="label-icon">👤</span> Mã Khách Hàng:
                    </label>
                    <input type="text" id="MaKhachHang" name="MaKhachHang" placeholder="Nhập mã khách hàng" required>
                </div>

                <div class="form-group">
                    <label for="MaThuCung">
                        <span class="label-icon">🐾</span> Mã Thú Cưng:
                    </label>
                    <input type="text" id="MaThuCung" name="MaThuCung" placeholder="Nhập mã thú cưng" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="MaChiNhanh">
                            <span class="label-icon">🏥</span> Chi Nhánh:
                        </label>
                        <select id="MaChiNhanh" name="MaChiNhanh" required>
                            <option value="">-- Chọn chi nhánh --</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="LoaiLichHen">
                            <span class="label-icon">💉</span> Loại Dịch Vụ:
                        </label>
                        <select id="LoaiLichHen" name="LoaiLichHen" required>
                            <option value="">-- Chọn dịch vụ --</option>
                            <option value="Khám bệnh">Khám Bệnh</option>
                            <option value="Tiêm phòng">Tiêm Phòng</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="ThoiGian">
                        <span class="label-icon">🕐</span> Ngày & Giờ Hẹn:
                    </label>
                    <input type="datetime-local" id="ThoiGian" name="ThoiGian" required>
                </div>

                <div class="form-group">
                    <label for="GhiChu">
                        <span class="label-icon">📝</span> Ghi Chú Triệu Chứng:
                    </label>
                    <textarea id="GhiChu" name="GhiChu" rows="4" placeholder="Mô tả tình trạng sức khỏe của thú cưng..."></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">✓ Xác Nhận Đặt Lịch</button>
                    <button type="reset" class="btn btn-secondary">↻ Nhập Lại</button>
                </div>

                <div id="successMessage" class="message message-success" style="display: none;">
                    ✓ Đặt lịch hẹn thành công! Mã lịch hẹn: <strong id="bookingId"></strong>
                </div>
                <div id="errorMessage" class="message message-error" style="display: none;"></div>
            </form>

            <hr style="margin: 40px 0;">

            <h2>📋 Lịch Hẹn Của Tôi</h2>
            <div class="search-box">
                <input type="text" id="searchCustomer" placeholder="Nhập mã khách hàng để xem lịch hẹn..." class="search-input">
                <button id="searchBtn" class="btn btn-primary">Tìm Kiếm</button>
            </div>

            <div id="bookingList" class="booking-list">
                <!-- Danh sách lịch hẹn sẽ được hiển thị tại đây -->
            </div>
        </div>
    </div>

    <script src="/js/customer-booking.js"></script>
</body>
</html>
