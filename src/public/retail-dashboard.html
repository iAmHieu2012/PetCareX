<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retail Staff Dashboard - PetCareX</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/unified-dashboard.css">
    <link rel="stylesheet" href="css/theme-retail.css">
</head>
<body>
    <header class="header">
        <div class="header-container">
            <div class="logo"><i class="fas fa-paw"></i> <span>PetCareX Retail</span></div>
            <div class="header-right">
                <div class="user-info">
                    <span id="userName" class="name">Nhân Viên Bán Hàng</span>
                    <span class="loyalty-points">Retail Staff</span>
                </div>
                <button id="logoutBtn" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Đăng xuất</button>
            </div>
        </div>
    </header>

    <main class="dashboard-container">
        <div class="welcome-banner">
            <div class="banner-content">
                <h1 id="greeting-message">Chào buổi sáng, Nhân viên bán hàng!</h1>
                <p>Quản lý hóa đơn bán hàng và kho hàng tại chi nhánh</p>
                <div class="flex gap-lg mt-lg">
                    <div><small>Chưa xác nhận:</small> <strong id="pendingCount">0</strong></div>
                    <div><small>Đã xác nhận:</small> <strong id="confirmedCount">0</strong></div>
                </div>
            </div>
            <div class="banner-icon"><i class="fas fa-shopping-bag"></i></div>
        </div>

        <div class="tabs-navigation">
            <div class="tabs-header">
                <button class="tab-btn active" data-tab="payment"><i class="fas fa-receipt"></i> Xác Nhận Thanh Toán</button>
                <button class="tab-btn" data-tab="warehouse"><i class="fas fa-warehouse"></i> Kho Hàng</button>
            </div>
        </div>

        <div class="tabs-content">
            <!-- TAB XÁC NHẬN THANH TOÁN -->
            <div class="tab-pane active" id="payment-tab">
                <div class="tab-header mb-lg">
                    <h2>Xác Nhận Thanh Toán Hóa Đơn</h2>
                    <p class="text-muted text-sm">Xác nhận thanh toán cho các hóa đơn bán hàng</p>
                </div>

                <div id="unconfirmedInvoicesList">
                    <div class="empty-state">
                        <i class="fas fa-check-circle"></i>
                        <p>Không có hóa đơn chưa xác nhận</p>
                    </div>
                </div>
            </div>

            <!-- HIDE KHO HÀNG -->
        </div>
    </main>

    <script type="module" src="js/retail-dashboard.js"></script>
</body>
</html>
