<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - PetCareX</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="login-container">
        <form id="registerForm">
            <h2>🐾 TẠO TÀI KHOẢN</h2>
            <p>Dành cho khách hàng thân thiết</p>
            
            <div class="input-group">
                <label>Họ và Tên</label>
                <input type="text" id="reg_fullname" placeholder="Nguyễn Văn A" required>
            </div>

            <div style="display: flex; gap: 10px;">
                <div class="input-group" style="flex: 2;">
                    <label>Số điện thoại</label>
                    <input type="text" id="reg_phone" placeholder="090..." required>
                </div>
                <div class="input-group" style="flex: 1;">
                    <label>Giới tính</label>
                    <select id="reg_gender">
                        <option value="Nam">Nam</option>
                        <option value="Nữ">Nữ</option>
                    </select>
                </div>
            </div>

            <div class="input-group">
                <label>Số CCCD</label>
                <input type="text" id="reg_cccd" maxlength="12" placeholder="12 chữ số" required>
            </div>

            <div class="input-group">
                <label>Tên đăng nhập</label>
                <input type="text" id="reg_username" required>
            </div>

            <div class="input-group">
                <label>Email</label>
                <input type="email" id="reg_email" placeholder="example@gmail.com" required>
            </div>

            <div class="input-group">
                <label>Mật khẩu</label>
                <div class="password-group">
                    <input type="password" id="password" placeholder="••••••••" required>
                    <i class="fas fa-eye toggle-btn" id="toggleIcon" onclick="togglePass('password', 'toggleIcon')"></i>
                </div>
            </div>

            <button type="submit" id="btnRegister">Đăng Ký</button>
            <div id="reg_message" class="error-msg"></div>
            <p style="margin-top: 15px;">Đã có tài khoản? <a href="index.html">Đăng nhập</a></p>
        </form>
    </div>
    <script src="js/register.js"></script>
</body>
</html>
