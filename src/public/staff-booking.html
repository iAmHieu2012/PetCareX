<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Lịch Hẹn - PETCAREX (Nhân Viên)</title>
    <link rel="stylesheet" href="/css/booking.css">
    <style>
        .page-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logout-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .logout-btn:hover {
            background: #c82333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page-header">
            <div>
                <h1>👨‍💼 QUẢN LÝ LỊCH HẸN</h1>
                <p style="margin-top: 5px; font-size: 14px;">Nhân viên tiếp tân</p>
            </div>
            <button class="logout-btn" onclick="logout()">Đăng Xuất</button>
        </div>

        <!-- TAB: TẠO LỊCH HẸN -->
        <div class="tab-content active">
            <div class="form-container">
                <h2>✏️ TẠO LỊCH HẸN MỚI</h2>
                
                <form id="staffBookingForm">
                    <div class="form-group">
                        <label for="staffMaKhachHang">
                            <span class="label-icon">👤</span> Mã Khách Hàng:
                        </label>
                        <input type="text" id="staffMaKhachHang" name="staffMaKhachHang" placeholder="Nhập mã khách hàng" required>
                    </div>

                    <div class="form-group">
                        <label for="staffMaThuCung">
                            <span class="label-icon">🐾</span> Mã Thú Cưng:
                        </label>
                        <input type="text" id="staffMaThuCung" name="staffMaThuCung" placeholder="Nhập mã thú cưng" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="staffMaChiNhanh">
                                <span class="label-icon">🏥</span> Chi Nhánh:
                            </label>
                            <select id="staffMaChiNhanh" name="staffMaChiNhanh" required>
                                <option value="">-- Chọn chi nhánh --</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="staffLoaiLichHen">
                                <span class="label-icon">💉</span> Loại Dịch Vụ:
                            </label>
                            <select id="staffLoaiLichHen" name="staffLoaiLichHen" required>
                                <option value="">-- Chọn dịch vụ --</option>
                                <option value="Khám bệnh">Khám Bệnh</option>
                                <option value="Tiêm phòng">Tiêm Phòng</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="staffThoiGian">
                            <span class="label-icon">🕐</span> Ngày & Giờ Hẹn:
                        </label>
                        <input type="datetime-local" id="staffThoiGian" name="staffThoiGian" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="staffMaNhanVien">
                                <span class="label-icon">👨‍⚕️</span> Mã Nhân Viên Xác Nhận:
                            </label>
                            <input type="text" id="staffMaNhanVien" name="staffMaNhanVien" placeholder="(Tùy chọn)">
                        </div>

                        <div class="form-group">
                            <label for="staffTrangThai">
                                <span class="label-icon">✓</span> Trạng Thái:
                            </label>
                            <select id="staffTrangThai" name="staffTrangThai" required>
                                <option value="Chờ xác nhận">Chờ Xác Nhận</option>
                                <option value="Đã xác nhận">Đã Xác Nhận (+ Tạo PDV)</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">✓ Tạo Lịch Hẹn</button>
                        <button type="reset" class="btn btn-secondary">↻ Nhập Lại</button>
                    </div>

                    <div id="staffSuccessMessage" class="message message-success" style="display: none;">
                        ✓ Tạo lịch hẹn thành công! Mã lịch hẹn: <strong id="staffBookingId"></strong>
                        <div id="staffPDVInfo" style="margin-top: 10px;"></div>
                    </div>
                    <div id="staffErrorMessage" class="message message-error" style="display: none;"></div>
                </form>

                <hr style="margin: 40px 0;">

                <h2>📅 DANH SÁCH LỊCH HẸN CHI NHÁNH</h2>
                <div class="search-box">
                    <select id="searchBranch" class="search-input" style="width: 100%;">
                        <option value="">-- Chọn chi nhánh --</option>
                    </select>
                    <button id="searchBranchBtn" class="btn btn-primary">Xem Lịch</button>
                </div>

                <div id="branchBookingList" class="booking-list">
                    <!-- Danh sách lịch hẹn chi nhánh sẽ được hiển thị tại đây -->
                </div>
            </div>
        </div>
    </div>

    <script src="/js/staff-booking.js"></script>
</body>
</html>
